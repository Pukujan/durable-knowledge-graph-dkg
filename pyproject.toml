[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fossil-core"
version = "0.1.0"
description = "FOSSIL: durable contracts and rebuildable projections for intellectual lineage"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
graphiti = ["graphiti-core==0.29.3"]
semantic = ["sentence-transformers==5.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
