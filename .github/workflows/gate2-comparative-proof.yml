name: Gate 2 comparative bakeoff proof

on:
  pull_request:

jobs:
  comparative-proof:
    runs-on: ubuntu-latest
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install semantic runtime
        run: python -m pip install -e '.[test,semantic]'
      - name: Test comparison contracts
        run: pytest -q tests/test_benchmark_compare.py tests/test_real_retrieval.py tests/test_real_retrieval_context.py
      - name: Run exact-pinned comparative bakeoff
        run: |
          git clone --quiet https://github.com/Pukujan/fossil-common.git .gate2-packs/common
          git -C .gate2-packs/common checkout --quiet d583005dce06dbb499c3c0de5c22b899655eb8d2
          git clone --quiet https://github.com/Pukujan/fossil-ai-systems.git .gate2-packs/ai-systems
          git -C .gate2-packs/ai-systems checkout --quiet cf7cf4087bde543cb247a978de2a7252b1b8e4de
          python scripts/run_gate2_comparative_bakeoff.py \
            --common-root .gate2-packs/common \
            --ai-root .gate2-packs/ai-systems \
            --case-set benchmarks/gate2/real-corpus-history-v2.json \
            --output-dir .gate2-comparison-output \
            --device cpu
      - name: Upload comparative evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate2-comparative-results
          path: .gate2-comparison-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
