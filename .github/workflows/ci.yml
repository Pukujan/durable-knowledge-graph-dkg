name: DKG contract tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest -q

  # Disposable proof job for Issue #10. This branch-only workflow change is not merged.
  live-redaction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/fossil-gate1-pass
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7474:7474
          - 7687:7687
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: fossil-gate1-pass
      GRAPHITI_LLM_BASE_URL: http://127.0.0.1:11434/v1
      GRAPHITI_LLM_API_KEY: ollama
      GRAPHITI_LLM_MODEL: deepseek-r1:7b
      GRAPHITI_SMALL_MODEL: deepseek-r1:7b
      GRAPHITI_EMBEDDING_MODEL: nomic-embed-text
      GRAPHITI_EMBEDDING_DIM: "768"
      GRAPHITI_STRUCTURED_OUTPUT_MODE: json_schema
      GRAPHITI_TELEMETRY_ENABLED: "false"
      SEMAPHORE_LIMIT: "1"
      FOSSIL_ONTOLOGY_VERSION: "1.0.0"
      FOSSIL_SOFTWARE_COMMIT: ${{ github.sha }}
      FOSSIL_REDACTION_PROOF_PATH: ${{ runner.temp }}/fossil-live-redaction-proof.json
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FOSSIL with Graphiti
        run: python -m pip install -e '.[test,graphiti]'
      - name: Install and start Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >"${RUNNER_TEMP}/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/ollama.log"
          exit 1
      - name: Pull local Graphiti models
        run: |
          ollama pull deepseek-r1:7b
          ollama pull nomic-embed-text
      - name: Run live redaction proof
        run: python scripts/live_redaction_smoke.py
      - name: Upload redaction proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fossil-live-redaction-proof
          path: ${{ runner.temp }}/fossil-live-redaction-proof.json
          if-no-files-found: warn
      - name: Show Ollama log on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/ollama.log" || true
