name: DKG contract tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest -q
      - name: Post-Gate-2 retrieval poisoning real-corpus proof
        run: |
          git clone --quiet https://github.com/Pukujan/fossil-common.git .poison-packs/common
          git -C .poison-packs/common checkout --quiet d583005dce06dbb499c3c0de5c22b899655eb8d2
          git clone --quiet https://github.com/Pukujan/fossil-ai-systems.git .poison-packs/ai-systems
          git -C .poison-packs/ai-systems checkout --quiet 84accd2ee895663990e82ca5b79b592cb503db24
          python scripts/run_post_gate2_retrieval_poisoning.py \
            --common-root .poison-packs/common \
            --ai-root .poison-packs/ai-systems \
            --output .poison-proof/report.json
