name: Mutation assurance

on:
  pull_request:
    paths:
      - "src/fossil_core/domain/lifecycle.py"
      - "src/fossil_core/domain/pack.py"
      - "tests/test_lifecycle.py"
      - "tests/test_lifecycle_properties.py"
      - "tests/test_temporal_benchmark.py"
      - "tests/test_rebuild_temporal_properties.py"
      - "tests/test_pack.py"
      - "tests/test_pack_properties.py"
      - "tests/test_agent_query_composition.py"
      - "tests/test_agent_query_composition_properties.py"
      - "tests/test_mutation_assurance.py"
      - "scripts/check_mutation_assurance.py"
      - ".github/workflows/mutation-assurance.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/fossil_core/domain/lifecycle.py"
      - "src/fossil_core/domain/pack.py"
      - "tests/test_lifecycle.py"
      - "tests/test_lifecycle_properties.py"
      - "tests/test_temporal_benchmark.py"
      - "tests/test_rebuild_temporal_properties.py"
      - "tests/test_pack.py"
      - "tests/test_pack_properties.py"
      - "tests/test_agent_query_composition.py"
      - "tests/test_agent_query_composition_properties.py"
      - "tests/test_mutation_assurance.py"
      - "scripts/check_mutation_assurance.py"
      - ".github/workflows/mutation-assurance.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  lifecycle-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install targeted mutation toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,mutation]'
          python -m pip check
          mutmut --version
      - name: Run lifecycle and pack mutants
        run: |
          rm -rf mutants
          mutmut run
          mkdir -p build/assurance
          mutmut results | tee build/assurance/mutation-lifecycle-pack-survivors.txt
          mutmut export-cicd-stats
      - name: Enforce mutation strength
        run: |
          python scripts/check_mutation_assurance.py \
            mutants/mutmut-cicd-stats.json \
            --scope lifecycle-pack \
            --minimum-score 92 \
            --maximum-survivors 13 \
            --maximum-no-tests 0 \
            --receipt build/assurance/mutation-lifecycle-pack.json
      - name: Emit compact mutation receipt
        shell: bash
        run: |
          {
            echo "## Lifecycle + pack mutation receipt"
            echo '```json'
            cat build/assurance/mutation-lifecycle-pack.json
            echo '```'
            echo "### Surviving mutants"
            echo '```text'
            cat build/assurance/mutation-lifecycle-pack-survivors.txt
            echo '```'
            echo "- issue: #176"
            echo "- coordination: #94"
            echo "- tool: mutmut 3.7.0 source pinned at dc58270d5234752e22247f814431750eafcf6e5f"
            echo "- baseline: 167/180 killed (92.78%); 13 message-only survivors; 0 no-test mutants"
            echo "- gate: score >= 92%; survivors <= 13; no-test mutants = 0"
            echo "- security: secretless; contents:read"
          } >> "$GITHUB_STEP_SUMMARY"
