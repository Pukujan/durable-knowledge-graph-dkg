name: Agent authorization mutation assurance

on:
  pull_request:
    paths:
      - "src/fossil_core/agent.py"
      - "tests/test_agent_boundary.py"
      - "tests/test_agent_authorization_mutation_oracles.py"
      - "scripts/check_mutation_assurance.py"
      - ".github/workflows/mutation-agent-authorization.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/fossil_core/agent.py"
      - "tests/test_agent_boundary.py"
      - "tests/test_agent_authorization_mutation_oracles.py"
      - "scripts/check_mutation_assurance.py"
      - ".github/workflows/mutation-agent-authorization.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  agent-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOSSIL_SOFTWARE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact target checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${FOSSIL_SOFTWARE_COMMIT}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mutation toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,mutation,s3]'
          python -m pip check
          mutmut --version
      - name: Configure isolated agent mutation source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          marker = "[tool.mutmut]\n"
          if marker not in text:
              raise SystemExit("missing [tool.mutmut] block")
          prefix, _old = text.split(marker, 1)
          scoped = '''[tool.mutmut]
          source_paths = ["src/fossil_core"]
          only_mutate = ["src/fossil_core/agent.py"]
          also_copy = ["schemas", "examples", "skills"]
          pytest_add_cli_args_test_selection = [
            "tests/test_agent_boundary.py",
          ]
          '''
          path.write_text(prefix + scoped, encoding="utf-8")
          PY
      - name: Run selected agent authorization mutants
        shell: bash
        run: |
          rm -rf mutants
          mutmut run \
            '*CorpusService*_authorize__mutmut_*' \
            '*CorpusService*_require_actor_match__mutmut_*' \
            '*CorpusService*propose__mutmut_*' \
            '*CorpusService*validate__mutmut_*' \
            '*CorpusService*commit__mutmut_*'
      - name: Export selected-scope mutation evidence
        shell: bash
        run: |
          mkdir -p build/assurance
          python - <<'PY'
          import fnmatch
          import json
          from collections import Counter
          from pathlib import Path

          patterns = (
              "*CorpusService*_authorize__mutmut_*",
              "*CorpusService*_require_actor_match__mutmut_*",
              "*CorpusService*propose__mutmut_*",
              "*CorpusService*validate__mutmut_*",
              "*CorpusService*commit__mutmut_*",
          )
          meta_path = Path("mutants/src/fossil_core/agent.py.meta")
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          all_results = meta["exit_code_by_key"]
          selected = {
              key: code
              for key, code in all_results.items()
              if any(fnmatch.fnmatch(key, pattern) for pattern in patterns)
          }
          if not selected:
              raise SystemExit("selected agent mutation patterns matched no mutants")
          not_checked = [key for key, code in selected.items() if code is None]
          if not_checked:
              raise SystemExit(
                  f"selected mutation run left {len(not_checked)} mutant(s) unchecked: {not_checked[:5]}"
              )

          status_by_exit_code = {
              0: "survived",
              1: "killed",
              2: "check_was_interrupted_by_user",
              3: "killed",
              5: "no_tests",
              24: "timeout",
              33: "no_tests",
              34: "skipped",
              35: "suspicious",
              36: "timeout",
              37: "caught_by_type_check",
              152: "timeout",
              255: "timeout",
              -9: "segfault",
              -11: "segfault",
              -24: "timeout",
          }
          unknown = {code for code in selected.values() if code not in status_by_exit_code}
          if unknown:
              raise SystemExit(f"unknown mutmut exit code(s) in selected scope: {sorted(unknown)}")
          statuses = {key: status_by_exit_code[code] for key, code in selected.items()}
          caught = [key for key, status in statuses.items() if status == "caught_by_type_check"]
          if caught:
              raise SystemExit(
                  "selected scope produced caught-by-type-check mutants unsupported by the current "
                  f"FOSSIL receipt schema: {caught[:5]}"
              )
          counts = Counter(statuses.values())
          stats = {
              "killed": counts["killed"],
              "survived": counts["survived"],
              "total": len(selected),
              "no_tests": counts["no_tests"],
              "skipped": counts["skipped"],
              "suspicious": counts["suspicious"],
              "timeout": counts["timeout"],
              "check_was_interrupted_by_user": counts["check_was_interrupted_by_user"],
              "segfault": counts["segfault"],
          }
          Path("build/assurance/mutation-agent-authorization-stats.json").write_text(
              json.dumps(stats, indent=2) + "\n", encoding="utf-8"
          )
          survivors = [
              f"{key}: {status}"
              for key, status in sorted(statuses.items())
              if status in {"survived", "no_tests"}
          ]
          Path("build/assurance/mutation-agent-authorization-survivors.txt").write_text(
              "\n".join(survivors) + ("\n" if survivors else ""), encoding="utf-8"
          )
          Path("build/assurance/mutation-agent-authorization-selected-keys.txt").write_text(
              "\n".join(sorted(selected)) + "\n", encoding="utf-8"
          )
          print(json.dumps(stats, indent=2))
          print(f"selected_mutants={len(selected)} total_generated_mutants={len(all_results)}")
          PY
      - name: Show selected surviving mutant diffs
        shell: bash
        run: |
          awk -F': ' '/: (survived|no_tests)$/ {print $1}' \
            build/assurance/mutation-agent-authorization-survivors.txt \
          | while IFS= read -r mutant; do
              echo "::group::${mutant}"
              mutmut show "${mutant}"
              echo "::endgroup::"
            done
      - name: Characterize agent authorization mutation strength
        run: |
          python scripts/check_mutation_assurance.py \
            build/assurance/mutation-agent-authorization-stats.json \
            --scope agent-authorization \
            --minimum-score 0 \
            --receipt build/assurance/mutation-agent-authorization.json
      - name: Emit compact mutation receipt
        shell: bash
        run: |
          {
            echo "## Agent authorization mutation characterization"
            echo '```json'
            cat build/assurance/mutation-agent-authorization.json
            echo '```'
            echo "### Selected surviving mutants"
            echo '```text'
            cat build/assurance/mutation-agent-authorization-survivors.txt
            echo '```'
            echo "- issue: #176"
            echo "- coordination: #94"
            echo "- properties: FOSSIL-PROP-PROVENANCE-001, FOSSIL-PROP-PACK-ISOLATION-001, FOSSIL-PROP-UNTRUSTED-CONTEXT-001"
            echo "- tool: mutmut source pinned at dc58270d5234752e22247f814431750eafcf6e5f"
            echo "- mutable source file: src/fossil_core/agent.py"
            echo "- selected methods only: CorpusService._authorize, _require_actor_match, propose, validate, commit"
            echo "- excluded: CorpusService.propose_promotion and all search/context/read/lineage/manage/ThinMCP mutants"
            echo "- scoped receipt: counts only selected mutant keys; unselected generated keys are excluded from the denominator"
            echo "- mode: characterization; threshold will be set from selected-survivor evidence"
            echo "- security: secretless; contents:read"
          } >> "$GITHUB_STEP_SUMMARY"
