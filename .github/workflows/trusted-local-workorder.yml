name: Trusted local WorkOrder

on:
  workflow_dispatch:
    inputs:
      work_order:
        description: "Versioned trusted-local WorkOrder JSON; validated again by the dispatcher"
        required: true
        type: string
      agent:
        description: "Expected current #94 claim owner"
        required: true
        type: string

# There is deliberately no PR-derived, repository, issue-comment, or workflow-run
# trigger. GitHub dispatches this workflow only from its reviewed default branch.
permissions:
  contents: read
  issues: read

jobs:
  secretless-workorder:
    runs-on: [self-hosted, trusted-local]
    timeout-minutes: 30
    steps:
      - name: Check out the trusted default-branch dispatcher only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install dispatcher dependencies
        run: python -m pip install -e '.[test]'
      - name: Run isolated secretless WorkOrder
        env:
          # This ephemeral, read-only token is used only to re-read #94 before
          # launch. The child worker receives a minimal environment without it.
          GITHUB_TOKEN: ${{ github.token }}
          FOSSIL_WORK_ORDER_JSON: ${{ inputs.work_order }}
        run: >-
          python scripts/run_trusted_local_workorder.py
          --work-order-env FOSSIL_WORK_ORDER_JSON
          --agent '${{ inputs.agent }}'
          --trusted-dispatch-ref '${{ github.sha }}'
          --check-profile pytest
