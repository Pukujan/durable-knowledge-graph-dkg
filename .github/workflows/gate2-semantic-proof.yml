name: Gate 2 semantic retrieval proof

on:
  pull_request:

jobs:
  semantic-proof:
    runs-on: ubuntu-latest
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install semantic runtime
        run: python -m pip install -e '.[test,semantic]'
      - name: Test adapter contracts
        run: pytest -q tests/test_real_retrieval.py tests/test_real_retrieval_context.py
      - name: Benchmark exact pinned corpus
        run: |
          git clone --quiet https://github.com/Pukujan/fossil-common.git .gate2-packs/common
          git -C .gate2-packs/common checkout --quiet d583005dce06dbb499c3c0de5c22b899655eb8d2
          git clone --quiet https://github.com/Pukujan/fossil-ai-systems.git .gate2-packs/ai-systems
          git -C .gate2-packs/ai-systems checkout --quiet cf7cf4087bde543cb247a978de2a7252b1b8e4de
          python scripts/run_gate2_real_retrieval_candidates.py \
            --common-root .gate2-packs/common \
            --ai-root .gate2-packs/ai-systems \
            --case-set benchmarks/gate2/real-corpus-history-v2.json \
            --output-dir .gate2-results \
            --device cpu
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('.gate2-results').glob('*.json')):
              result = json.loads(path.read_text())
              print(f"DETAIL {path.name}")
              print("SERVICE", json.dumps(result['service'], sort_keys=True))
              for observation in result['observations']:
                  if observation['failed'] or observation['recall_at_k'] < 1.0 or observation['reciprocal_rank'] < 1.0:
                      print(json.dumps(observation, sort_keys=True))
          PY
