name: S3 storage mutation assurance

on:
  pull_request:
    paths:
      - "src/fossil_core/adapters/s3/storage.py"
      - "src/fossil_core/s3_storage.py"
      - "tests/test_s3_storage_adapter.py"
      - "scripts/check_mutation_assurance.py"
      - ".github/workflows/mutation-s3-storage.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/fossil_core/adapters/s3/storage.py"
      - "src/fossil_core/s3_storage.py"
      - "tests/test_s3_storage_adapter.py"
      - "scripts/check_mutation_assurance.py"
      - ".github/workflows/mutation-s3-storage.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  s3-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOSSIL_SOFTWARE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact target checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${FOSSIL_SOFTWARE_COMMIT}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mutation toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,mutation,s3]'
          python -m pip check
          mutmut --version
      - name: Configure isolated S3 storage mutation scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          marker = "[tool.mutmut]\n"
          if marker not in text:
              raise SystemExit("missing [tool.mutmut] block")
          prefix, _old = text.split(marker, 1)
          scoped = '''[tool.mutmut]
          source_paths = ["src/fossil_core"]
          only_mutate = ["src/fossil_core/adapters/s3/storage.py"]
          also_copy = ["schemas", "examples", "skills"]
          pytest_add_cli_args_test_selection = [
            "tests/test_s3_storage_adapter.py",
          ]
          '''
          path.write_text(prefix + scoped, encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY
      - name: Run S3 storage mutants
        shell: bash
        run: |
          rm -rf mutants
          mutmut run
          mkdir -p build/assurance
          mutmut results | tee build/assurance/mutation-s3-storage-survivors.txt
          mutmut export-cicd-stats
      - name: Collect surviving mutant evidence
        shell: bash
        run: |
          awk -F': ' '/: (survived|no tests)$/ {gsub(/^[[:space:]]+/, "", $1); print $1}' \
            build/assurance/mutation-s3-storage-survivors.txt \
            > build/assurance/mutation-s3-storage-survivor-names.txt
          : > build/assurance/mutation-s3-storage-survivor-diffs.txt
          while IFS= read -r mutant; do
            {
              echo "===== ${mutant} ====="
              mutmut show "${mutant}"
              echo
            } >> build/assurance/mutation-s3-storage-survivor-diffs.txt
          done < build/assurance/mutation-s3-storage-survivor-names.txt
      - name: Characterize S3 storage mutation strength
        run: |
          python scripts/check_mutation_assurance.py \
            mutants/mutmut-cicd-stats.json \
            --scope s3-storage \
            --minimum-score 0 \
            --receipt build/assurance/mutation-s3-storage.json
      - name: Upload S3 mutation evidence
        uses: actions/upload-artifact@v4
        with:
          name: s3-storage-mutation-evidence
          path: |
            build/assurance/mutation-s3-storage.json
            build/assurance/mutation-s3-storage-survivors.txt
            build/assurance/mutation-s3-storage-survivor-names.txt
            build/assurance/mutation-s3-storage-survivor-diffs.txt
          retention-days: 7
      - name: Emit compact mutation receipt
        shell: bash
        run: |
          {
            echo "## S3 storage mutation characterization"
            echo '```json'
            cat build/assurance/mutation-s3-storage.json
            echo '```'
            echo "### Surviving mutants"
            echo '```text'
            cat build/assurance/mutation-s3-storage-survivors.txt
            echo '```'
            echo "- issue: #176"
            echo "- coordination: #94"
            echo "- properties: FOSSIL-PROP-ARTIFACT-INTEGRITY-001, FOSSIL-PROP-IDEMPOTENCY-001, FOSSIL-PROP-REDACTION-NONRESURRECTION-001"
            echo "- tool: mutmut source pinned at dc58270d5234752e22247f814431750eafcf6e5f"
            echo "- mutable source: src/fossil_core/adapters/s3/storage.py only"
            echo "- tests: deterministic in-memory FakeS3Client only; no credentials or live object-store calls"
            echo "- evidence: uploaded as s3-storage-mutation-evidence artifact; no job-log scraping required"
            echo "- mode: characterization; threshold will be set from survivor evidence"
            echo "- security: secretless; contents:read"
          } >> "$GITHUB_STEP_SUMMARY"
