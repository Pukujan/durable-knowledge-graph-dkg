name: Graphiti live integration
# Explicit low-level ref-push dispatch path for Gate 1 proof.

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - ".github/workflows/graphiti-live.yml"
      - "scripts/live_graphiti_smoke.py"
      - "src/dkg/event_store.py"
      - "src/dkg/projection/**"
      - "schemas/events/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/graphiti-live.yml"
      - "scripts/live_graphiti_smoke.py"
      - "src/dkg/event_store.py"
      - "src/dkg/projection/**"
      - "schemas/events/**"
      - "pyproject.toml"

permissions:
  contents: read
  issues: write

jobs:
  live-graphiti-smoke:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 4 &&
       github.event.comment.user.login == 'Pukujan' &&
       github.event.comment.body == '/run-graphiti-live-proof')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/fossil-gate1-pass
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7474:7474
          - 7687:7687

    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: fossil-gate1-pass
      GRAPHITI_LLM_BASE_URL: http://127.0.0.1:11434/v1
      GRAPHITI_LLM_API_KEY: ollama
      GRAPHITI_LLM_MODEL: deepseek-r1:7b
      GRAPHITI_SMALL_MODEL: deepseek-r1:7b
      GRAPHITI_EMBEDDING_MODEL: nomic-embed-text
      GRAPHITI_EMBEDDING_DIM: "768"
      GRAPHITI_STRUCTURED_OUTPUT_MODE: json_object
      GRAPHITI_TELEMETRY_ENABLED: "false"
      SEMAPHORE_LIMIT: "1"
      FOSSIL_ONTOLOGY_VERSION: "1.0.0"
      FOSSIL_SOFTWARE_COMMIT: ${{ github.sha }}
      FOSSIL_PROOF_PATH: ${{ runner.temp }}/fossil-live-graphiti-proof.json
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FOSSIL with Graphiti
        run: python -m pip install -e '.[test,graphiti]'

      - name: Install and start Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >"${RUNNER_TEMP}/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/ollama.log"
          exit 1

      - name: Pull local Graphiti models
        run: |
          ollama pull deepseek-r1:7b
          ollama pull nomic-embed-text

      - name: Run durable-to-Graphiti live smoke
        run: python scripts/live_graphiti_smoke.py

      - name: Upload live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fossil-live-graphiti-proof
          path: ${{ runner.temp }}/fossil-live-graphiti-proof.json
          if-no-files-found: warn

      - name: Report proof result to Issue 4
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "${RUNNER_TEMP}/issue-report.md"
          import json
          import os
          from pathlib import Path

          proof_path = Path(os.environ["FOSSIL_PROOF_PATH"])
          status = os.environ.get("JOB_STATUS", "unknown")
          run_url = (
              f'{os.environ["GITHUB_SERVER_URL"]}/'
              f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/'
              f'{os.environ["GITHUB_RUN_ID"]}'
          )
          print(f"Automated FOSSIL Issue #4 live Graphiti proof: **{status}**")
          print()
          print(f"- trigger: `{os.environ.get('GITHUB_EVENT_NAME', 'unknown')}`")
          print(f"- workflow run: {run_url}")
          print(f"- workflow SHA: `{os.environ['GITHUB_SHA']}`")
          if proof_path.exists():
              proof = json.loads(proof_path.read_text(encoding="utf-8"))
              selected = {
                  key: proof.get(key)
                  for key in (
                      "status",
                      "stage",
                      "error_type",
                      "error",
                      "event_id",
                      "pack_id",
                      "build_manifest",
                      "first_receipt",
                      "after_first_projection",
                      "second_receipt",
                      "after_idempotent_retry",
                  )
                  if proof.get(key) is not None
              }
              print("- structured proof artifact: present")
              print()
              print("```json")
              print(json.dumps(selected, indent=2, sort_keys=True)[:12000])
              print("```")
          else:
              print("- structured proof artifact: **missing** (failure occurred before the proof runner produced it)")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/4/comments" \
            --method POST \
            -f "body=$(cat "${RUNNER_TEMP}/issue-report.md")"

      - name: Show Ollama log on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/ollama.log" || true
