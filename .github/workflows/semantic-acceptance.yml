name: Semantic acceptance

on:
  workflow_call:
    inputs:
      body-path:
        description: Path to a file holding the raw response body.
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-false-success-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run semantic false-success fixtures (2xx + empty must fail)
        shell: bash
        run: |
          python -m pytest -q tests/test_engineering_assurance_gate.py -k semantic
      - name: Apply semantic-acceptance gate to provided body
        if: inputs.body-path != ''
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/assurance")
          from assurance_gate import semantic_acceptance
          body = Path("${{ inputs.body-path }}").read_bytes()
          errors = semantic_acceptance(status_code=200, body=body)
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("semantic acceptance passed")
          PY