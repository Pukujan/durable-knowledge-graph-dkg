name: Dependency integrity

on:
  workflow_call:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/dependency-integrity.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/dependency-integrity.yml"

permissions:
  contents: read

jobs:
  pyproject-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Clean reproducible install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Check installed metadata consistency
        run: python -m pip check
      - name: Verify package metadata parses and name/version match
        run: |
          python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); assert d['project']['name']=='fossil-core'; assert d['project']['version']; print('pyproject consistent')"

  vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Best-effort dependency vulnerability scan
        shell: bash
        run: |
          if python -m pip_audit --version >/dev/null 2>&1; then
            python -m pip_audit --no-deps || exit 0
          elif python -m pip install --quiet pip-audit >/dev/null 2>&1; then
            python -m pip_audit || exit 0
          else
            echo "pip-audit unavailable; skipping non-blocking vulnerability scan"
            exit 0
          fi